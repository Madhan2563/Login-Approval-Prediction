<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Loanso - Banking Analysis Ltd. 
        </title>
        <link rel="shortcut icon" type="image/x-icon" href="static/ico.ico" />
        <link rel="stylesheet" href="static/style_login.css">
    </head>
    <body>
        <div id="header">   
            <img src="static/icon.png" alt="Logo" height="50px" width="50px">
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/">About</a></li>

            </ul>
        </div>
        <section>
            <div id="container">
            <form action="/login" method="post">
                <h2>Loan Analysis</h2>
                <p>Welcome to Loanso! Easy and quick financial analysis and loan assessment..<br>Sign in to get started with your personalized loan analysis .</p>
                {%if error %}
                    <p style="color: red;">{{error}}</p>
                {% endif %}
                <input type="text" name="username" placeholder="User Name" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Sign In</button>
                <a href="/register">Don't have an account? Sign Up</a>
            </form>
        </div>
            </section>
        </section>
    </body>
</html>
